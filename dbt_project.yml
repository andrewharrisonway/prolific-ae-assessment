name: 'global_transactions'
version: '1.0.0'
config-version: 2

profile: 'global_transactions'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  global_transactions:
    staging:
      +materialized: table
      # +schema: staging # NB: not used. dbt-sqlite maps each schema to its own attached .db file, and SQLite views cannot reference tables in another attached database, so intermediate views could not read staging tables
    intermediate:
      +materialized: view
      # +schema: intermediate # NB: not used. dbt-sqlite maps each schema to its own attached .db file, and SQLite views cannot reference tables in another attached database, so intermediate views could not read staging tables
    marts:
      +materialized: table
      # +schema: marts # NB: not used. dbt-sqlite maps each schema to its own attached .db file, and SQLite views cannot reference tables in another attached database, so intermediate views could not read staging tables
