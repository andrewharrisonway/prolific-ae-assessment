name: 'global_transactions'
version: '1.0.0'
config-version: 2
require-dbt-version: [">=1.11.0", "<2.0.0"] # unit tests need >=1.8; test `arguments:` syntax needs >=1.10

profile: 'global_transactions'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

vars:
  # Bounds of the dim_dates spine (end date exclusive). Fixed rather than taken
  # from the data, and wide enough for MetricFlow comparisons across years.
  date_spine_start_date: '2020-01-01'
  date_spine_end_date: '2031-01-01'

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  global_transactions:
    # dbt's recommended materialisations: staging and intermediate are views
    # (cheap, and always current with what they read), marts are tables
    # (what people query)
    staging:
      +materialized: view
      # +schema: staging # NB: not used. dbt-sqlite maps each schema to its own attached .db file, and SQLite views cannot reference objects in another attached database, so models in separate schemas could not read each other
    intermediate:
      +materialized: view
      # +schema: intermediate # NB: not used. dbt-sqlite maps each schema to its own attached .db file, and SQLite views cannot reference objects in another attached database, so models in separate schemas could not read each other
    marts:
      +materialized: table
      # +schema: marts # NB: not used. dbt-sqlite maps each schema to its own attached .db file, and SQLite views cannot reference objects in another attached database, so models in separate schemas could not read each other
