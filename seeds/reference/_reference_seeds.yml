version: 2

seeds:
  - name: transaction_types
    description: "Business rules for each transaction type: which way money moves, and whether the type counts toward revenue and contract spend. Adding or changing a transaction type is a change to this file, not to model logic."
    config:
      column_types:
        transaction_type: text
        amount_direction: int
        recognises_revenue: int
        counts_toward_spend: int
        requires_resolution: int
    columns:
      - name: transaction_type
        description: "{{ doc('transaction_type') }} Primary key of this seed."
        tests:
          - unique
          - not_null

      - name: amount_direction
        description: "{{ doc('amount_direction') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, -1]
                quote: false

      - name: recognises_revenue
        description: "1 if this type generates platform revenue."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: counts_toward_spend
        description: "1 if this type counts toward a client's cumulative contract spend."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: requires_resolution
        description: "1 if this type only counts once resolved (see `stg_global_transactions__transaction_resolutions`)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
