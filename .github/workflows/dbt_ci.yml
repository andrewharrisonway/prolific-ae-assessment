name: dbt CI

# Builds the project from a clean checkout, following the README's setup steps,
# then runs every test and the SQL linter. On pushes to main, it also publishes
# the dbt docs site to GitHub Pages (manual runs on main publish it too).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies (as in the README)
        run: |
          pip install uv
          uv venv dbt-env --python 3.11
          source dbt-env/bin/activate
          uv pip install -r requirements.txt
          echo "$PWD/dbt-env/bin" >> "$GITHUB_PATH"

      - name: Install dbt packages
        run: dbt deps

      # Raw data is loaded before building: models read it through source(),
      # which creates no dependency on the seeds in dbt's graph.
      - name: Load raw data
        run: dbt seed

      - name: Build and test
        run: dbt build

      - name: Lint SQL
        run: sqlfluff lint models tests analyses

      # The catalog reads column types from the built database, so the docs are
      # generated after the build. --static inlines the manifest and catalog
      # into a single page.
      - name: Generate docs site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          dbt docs generate --static
          mkdir -p docs_site
          cp target/static_index.html docs_site/index.html

      - name: Upload docs site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs_site

  deploy-docs:
    # Pull requests build and test only; the published docs always match main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
