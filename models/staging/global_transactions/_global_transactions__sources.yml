version: 2

sources:
  - name: global_transactions
    description: "Raw assessment data, loaded into the warehouse by `dbt seed` from seeds/raw/ (standing in for an extract-and-load tool). Freshness is not configured because the seeds are static; with a real loader, a `loaded_at_field` and freshness thresholds would be set here. Columns are tested on the staging models, which pass them through, rather than here: each column is tested once."
    schema: main
    tables:
      - name: transactions
        description: "All platform transactions"
        columns:
          - name: transaction_id
            description: "{{ doc('raw__transaction_id') }}"
          - name: client_id
            description: "{{ doc('raw__client_id') }}"
          - name: transaction_amount
            description: "{{ doc('raw__transaction_amount') }}"
          - name: transaction_type
            description: "{{ doc('raw__transaction_type') }}"
          - name: transaction_date
            description: "{{ doc('raw__transaction_date') }}"
          - name: platform_fee_margin
            description: "{{ doc('raw__platform_fee_margin') }}"
          - name: currency
            description: "{{ doc('raw__currency') }}"
          - name: linked_transaction_id
            description: "{{ doc('raw__linked_transaction_id') }}"
      - name: client_contracts
        description: "Client discount agreements"
        columns:
          - name: client_id
            description: "{{ doc('raw__client_id') }}"
          - name: contract_start_date
            description: "{{ doc('raw__contract_start_date') }}"
          - name: contract_duration_months
            description: "{{ doc('raw__contract_duration_months') }}"
          - name: spend_threshold
            description: "{{ doc('raw__spend_threshold') }}"
          - name: discounted_fee_margin
            description: "{{ doc('raw__discounted_fee_margin') }}"
      - name: currency_rates
        description: "Daily currency exchange rates"
        columns:
          - name: currency
            description: "{{ doc('raw__currency') }}"
          - name: rate_date
            description: "{{ doc('raw__rate_date') }}"
          - name: exchange_rate_to_gbp
            description: "{{ doc('raw__exchange_rate_to_gbp') }}"
      - name: transaction_resolutions
        description: "Chargeback resolution statuses"
        columns:
          - name: transaction_id
            description: "{{ doc('raw__resolution_transaction_id') }}"
          - name: resolution_status
            description: "{{ doc('raw__resolution_status') }}"
          - name: resolution_date
            description: "{{ doc('raw__resolution_date') }}"
