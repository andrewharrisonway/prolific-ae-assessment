version: 2

models:
  - name: stg_global_transactions__client_contracts
    description: "Staged client discount agreements, from the raw `client_contracts` source table."
    columns:
      - name: client_id
        description: "{{ doc('client_id') }} One contract per client."
        data_tests:
          - unique
          - not_null
          # NB: data quality gap. The source supplies no client master data, so client IDs can only be checked for format, not for existence. With a client list, this would be a relationships test to it.
          - dbt_utils.expression_is_true: # NB: GLOB, as SQLite has no regex
              arguments:
                expression: "GLOB 'C[0-9][0-9][0-9]'"

      - name: contract_start_date
        description: "{{ doc('contract_start_date') }}"
        data_tests:
          - not_null

      - name: contract_duration_months
        description: "{{ doc('contract_duration_months') }}"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: spend_threshold
        description: "{{ doc('spend_threshold') }}"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: discounted_fee_margin
        description: "{{ doc('discounted_fee_margin') }}"
        data_tests:
          - not_null

          # Range: hard bound
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

          # Range: soft bound. NB: a discount should sit below the standard platform fee margin (0.2 on every transaction)
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.1
                max_value: 0.2
                inclusive: false
              config:
                severity: warn

  - name: stg_global_transactions__currency_rates
    description: "Staged daily currency exchange rates, from the raw `currency_rates` source table. `exchange_rate_to_gbp` expresses how many GBP one unit of `currency` is worth on `rate_date`."
    # NB: daily rate completeness is tested in tests/assert_currency_rates_are_daily.sql
    columns:
      - name: currency_rate_id
        description: "Primary key: surrogate key for one currency on one date, generated with `dbt_utils.generate_surrogate_key` from `currency` and `rate_date`. On SQLite it is the readable input string (e.g. `GBP-2024-01-01`) rather than an md5 hash; see `macros/sqlite__hash.sql`."
        data_tests:
          - unique
          - not_null

      - name: currency
        description: "ISO currency code."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true: # NB: this would normally be a regex test, but is limited by sqlite
              arguments:
                expression: "GLOB '[A-Z][A-Z][A-Z]'"

      - name: rate_date
        description: "Date this exchange rate applies to."
        data_tests:
          - not_null

      - name: exchange_rate_to_gbp
        description: "Multiplier to convert one unit of currency into GBP (e.g. amount_in_currency * exchange_rate_to_gbp = amount_in_gbp)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 1
                inclusive: true
              config:
                where: "currency = 'GBP'"

  - name: stg_global_transactions__transactions
    description: "Staged transactions, lightly cleaned/standardised from the raw `transactions` source table."
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }}"
        data_tests:
          - unique
          - not_null
          - dbt_utils.expression_is_true: # NB: this would normally be a regex test, but is limited by sqlite
              arguments:
                expression: "GLOB 'T[0-9][0-9][0-9][0-9][0-9][0-9]'"
          - relationships:
              arguments:
                to: ref('stg_global_transactions__transaction_resolutions')
                field: transaction_id
              config:
                where: "transaction_type = 'chargeback'"

      - name: client_id
        description: "{{ doc('client_id') }} Contracts are in `stg_global_transactions__client_contracts`."
        data_tests:
          - not_null
          # NB: data quality gap. The source supplies no client master data, so client IDs can only be checked for format, not for existence. With a client list, this would be a relationships test to it.
          - dbt_utils.expression_is_true: # NB: GLOB, as SQLite has no regex
              arguments:
                expression: "GLOB 'C[0-9][0-9][0-9]'"

      - name: transaction_amount
        description: "Transaction amount in its original currency (see `transaction_currency`)."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true: # ASSUMPTION: all transaction amounts are positive
              arguments:
                expression: "> 0"

      - name: transaction_type
        description: "{{ doc('transaction_type') }}"
        data_tests:
          - not_null
          - relationships: # NB: valid types and their behaviour are defined in the transaction_types seed
              arguments:
                to: ref('transaction_types')
                field: transaction_type

      - name: transaction_date
        description: "{{ doc('transaction_date') }}"
        data_tests:
          - not_null # NB: captures dates that are nulled via the `date()` function for being malformed or missing

      - name: platform_fee_margin
        description: "{{ doc('platform_fee_margin') }}"
        data_tests:
          - not_null

          # Range: hard bound
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

          # Range: soft bound
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.1
                max_value: 0.3
                inclusive: true
              config:
                severity: warn

      - name: transaction_currency
        description: "{{ doc('transaction_currency') }}"
        data_tests:
          - not_null
          # NB: data quality gap. The source supplies no currency reference data, so currencies are checked against those that have exchange rates.
          - relationships:
              arguments:
                to: ref('stg_global_transactions__currency_rates')
                field: currency

      - name: linked_transaction_id
        description: "For refunds, references the transaction_id of the original payment being refunded. Null for all other transaction types."
        data_tests:
          - not_null:
              config:
                where: "transaction_type = 'refund'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "transaction_type != 'refund'"
          - dbt_utils.relationships_where: # refunds must link to a payment, not any transaction
              arguments:
                to: ref('stg_global_transactions__transactions')
                field: transaction_id
                to_condition: "transaction_type = 'payment'"
          # NB: refunds are always for the full payment amount, so a payment refunded twice is a duplicate.
          # The raw data has 6 such payments, flagged by is_duplicate_refund and excluded from revenue and spend.
          # The test accepts those known 6 and errors on any new ones; failing rows are stored for audit.
          - unique:
              config:
                warn_if: "> 6"
                error_if: "> 6"
                store_failures: true


      - name: is_duplicate_refund
        description: "{{ doc('is_duplicate_refund') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= 0"
              config:
                where: "transaction_type != 'refund'"

  - name: stg_global_transactions__transaction_resolutions
    description: "Staged chargeback resolution statuses, from the raw `transaction_resolutions` source table."
    columns:
      - name: transaction_id
        description: "References the transaction_id of the chargeback this resolution applies to."
        data_tests:
          - unique
          - not_null
          - dbt_utils.relationships_where: # resolutions only apply to chargebacks
              arguments:
                to: ref('stg_global_transactions__transactions')
                field: transaction_id
                to_condition: "transaction_type = 'chargeback'"

      - name: resolution_status
        description: "{{ doc('resolution_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['resolved', 'pending']

      - name: resolution_date
        description: "{{ doc('resolution_date') }} Converted from `dd/mm/yyyy` to an ISO date."
        data_tests:
          - not_null:
              config:
                where: "resolution_status = 'resolved'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "resolution_status = 'pending'"
