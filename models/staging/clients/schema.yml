version: 2

models:
  - name: stg_clients__client_contracts
    description: "Staged client discount agreements, from the raw `client_contracts` source table."
    columns:
      - name: client_id
        description: "{{ doc('client_id') }} One contract per client."
        tests:
          - unique
          - not_null
          - dbt_utils.expression_is_true: # NB: this should live on a client dim table, but is here as none exists
              arguments:
                expression: "GLOB 'C[0-9][0-9][0-9]'"
                # NB: this should have a relationship test to client table but none exists

      - name: contract_start_date
        description: "Date this contract took effect."
        tests:
          - not_null

      - name: contract_duration_months
        description: "Length of the contract in months."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: spend_threshold
        description: "Cumulative spend a client must reach within the contract term for the discounted fee margin to apply. ASSUMPTION: in GBP. The contracts table does not state a currency, and every client transacts in both GBP and USD."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: discounted_fee_margin
        description: "Contracted fee margin for this client once reaching spend threshold (`spend_threshold`)."
        tests:
          - not_null

          # Range: hard bound
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

          # Range: soft bound. NB: a discount should sit below the standard platform fee margin (0.2 on every transaction)
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.1
                max_value: 0.2
                inclusive: false
              config:
                severity: warn
