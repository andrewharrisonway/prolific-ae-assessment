version: 2

models:
  - name: stg_transactions__transactions
    description: "Staged transactions, lightly cleaned/standardised from the raw `transactions` source table."
    columns:
      - name: transaction_id
        description: "Unique transaction identifier."
        tests:
          - unique
          - not_null
          - dbt_utils.expression_is_true: # NB: this would normally be a regex test, but is limited by sqlite
              arguments:
                expression: "GLOB 'T[0-9][0-9][0-9][0-9][0-9][0-9]'"
          - relationships:
              arguments:
                to: ref('stg_transactions__transaction_resolutions')
                field: transaction_id
              config:
                where: "transaction_type = 'chargeback'"

      - name: client_id
        description: "Client identifier. There is no client dimension; contracts exist for some clients only (see `stg_clients__client_contracts`)."
        tests:
          - not_null
          - dbt_utils.expression_is_true: # NB: this would normally be a regex test, but is limited by sqlite
              arguments:                  # NB: this should live on a client dim table, but is here as none exists
                expression: "GLOB 'C[0-9][0-9][0-9]'" # NB: this should have a relationship test to client table but none exists

      - name: transaction_amount
        description: "Transaction amount in its original currency (see `transaction_currency`)."
        tests:
          - not_null
          - dbt_utils.expression_is_true: # ASSUMPTION: all transaction amounts are positive
              arguments:
                expression: "> 0"

      - name: transaction_type
        description: "Type of transaction."
        tests:
          - not_null
          - relationships: # NB: valid types and their behaviour are defined in the transaction_types seed
              arguments:
                to: ref('transaction_types')
                field: transaction_type

      - name: transaction_date
        description: "Date the transaction occurred."
        tests:
          - not_null # NB: captures dates that are nulled via the `date()` function for being malformed or missing

      - name: platform_fee_margin
        description: "Platform fee margin applied to this transaction."
        tests:
          - not_null

          # Range: hard bound
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

          # Range: soft bound
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.1
                max_value: 0.3
                inclusive: true
              config:
                severity: warn

      - name: transaction_currency
        description: "Currency code for transaction_amount."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_currencies__currency_rates') # NB: would normally point to currency dim table
                field: currency

      - name: linked_transaction_id
        description: "For refunds, references the transaction_id of the original payment being refunded. Null for all other transaction types."
        tests:
          - not_null:
              config:
                where: "transaction_type = 'refund'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "transaction_type != 'refund'"
          - dbt_utils.relationships_where: # refunds must link to a payment, not any transaction
              arguments:
                to: ref('stg_transactions__transactions')
                field: transaction_id
                to_condition: "transaction_type = 'payment'"
          - unique: # NB: refunds are always for the full payment amount, so a payment refunded twice is a duplicate. Warns because the raw data contains these; int__transactions flags and excludes them.
              config:
                severity: warn


      - name: is_duplicate_refund
        description: "1 for a refund of a payment that has already been refunded. Every refund is for the full payment amount, so only the first refund of a payment (by date, then transaction_id) is genuine. Flagged rather than filtered; int__transactions excludes flagged rows from revenue and spend."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= 0"
              config:
                where: "transaction_type != 'refund'"

  - name: stg_transactions__transaction_resolutions
    description: "Staged chargeback resolution statuses, from the raw `transaction_resolutions` source table."
    columns:
      - name: transaction_id
        description: "References the transaction_id of the chargeback this resolution applies to."
        tests:
          - unique
          - not_null
          - dbt_utils.relationships_where: # resolutions only apply to chargebacks
              arguments:
                to: ref('stg_transactions__transactions')
                field: transaction_id
                to_condition: "transaction_type = 'chargeback'"

      - name: resolution_status
        description: "Chargeback resolution status."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['resolved', 'pending']

      - name: resolution_date
        description: "Date the chargeback was resolved. Null while resolution_status is 'pending'."
        tests:
          - not_null:
              config:
                where: "resolution_status = 'resolved'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "resolution_status = 'pending'"