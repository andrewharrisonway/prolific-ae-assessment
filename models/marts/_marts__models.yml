version: 2

models:
  - name: dim_dates
    description: "One row per day, from 2020-01-01 to 2030-12-31 (set by the `date_spine_start_date` and `date_spine_end_date` project vars). A fixed spine, independent of the data: the month spine for `fct_client_monthly_revenue`, which limits it to the months the data covers, and the MetricFlow time spine. The relationships tests on `fct_transactions` dates check it covers the data."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: "Calendar date. Primary key of this model."
        granularity: day
        data_tests:
          - unique
          - not_null

      - name: month_start_date
        description: "{{ doc('month_start_date') }}"
        data_tests:
          - not_null

      - name: month_end_date
        description: "{{ doc('month_end_date') }}"
        data_tests:
          - not_null

  - name: fct_transactions
    description: "One row per transaction: amounts in GBP, revenue, recognition date and contract spend. The transaction-grain fact for reporting, and the model the semantic layer is defined on. Built from `int__transactions`, where every column is tested."
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int__transactions')
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }} Primary key of this model."
        data_tests:
          - unique
          - not_null

      - name: client_id
        description: "{{ doc('client_id') }}"

      - name: transaction_type
        description: "{{ doc('transaction_type') }}"

      - name: transaction_currency
        description: "{{ doc('transaction_currency') }}"

      - name: transaction_date
        description: "{{ doc('transaction_date') }}"
        data_tests:
          - relationships: # every transaction date must be covered by the date spine
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: resolution_status
        description: "{{ doc('resolution_status') }} Null for transactions that need no resolution."

      - name: resolution_date
        description: "{{ doc('resolution_date') }} Also null for transactions that need no resolution."

      - name: recognition_date
        description: "{{ doc('recognition_date') }}"
        data_tests:
          - relationships: # every recognition date must be covered by the date spine
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: spend_effective_date
        description: "{{ doc('spend_effective_date') }}"

      - name: amount_direction
        description: "{{ doc('amount_direction') }}"

      - name: gross_amount_local
        description: "{{ doc('gross_amount_local') }}"

      - name: net_amount_local
        description: "{{ doc('net_amount_local') }}"

      - name: gross_amount_gbp
        description: "{{ doc('gross_amount_gbp') }}"

      - name: net_amount_gbp
        description: "{{ doc('net_amount_gbp') }}"

      - name: is_duplicate_refund
        description: "{{ doc('is_duplicate_refund') }}"

      - name: is_revenue_recognised
        description: "{{ doc('is_revenue_recognised') }}"

      - name: is_spend_qualifying
        description: "{{ doc('is_spend_qualifying') }}"

      - name: is_in_contract_period
        description: "{{ doc('is_in_contract_period') }}"

      - name: contract_spend_gbp
        description: "{{ doc('contract_spend_gbp') }}"

      - name: is_discount_earned
        description: "{{ doc('is_discount_earned') }}"

      - name: applicable_fee_margin
        description: "{{ doc('applicable_fee_margin') }}"

      - name: revenue_gbp
        description: "{{ doc('revenue_gbp') }}"

  - name: fct_client_monthly_revenue
    description: "One row per client per month: recognised revenue and GMV in GBP, the same figures by transaction month, chargebacks pending at month end, and contract spend threshold and discount tracking. Every client appears in every month the data covers (from the first transaction to the last activity). GBP amounts are unrounded. Columns tagged `meta.additivity: semi_additive` are positions as at month end: they can be summed across clients but not across months. Columns tagged `non_additive` should never be summed."
    columns:
      - name: client_month_id
        description: "Primary key: surrogate key from `client_id` and `month_start_date`."
        data_tests:
          - unique
          - not_null

      - name: client_id
        description: "{{ doc('client_id') }}"

      - name: month_start_date
        description: "{{ doc('month_start_date') }} The month this row reports on."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: month_start_date

      - name: month_end_date
        description: "{{ doc('month_end_date') }} Point-in-time measures (pending chargebacks, contract and discount status) are as at this date."

      - name: is_partial_month
        description: "1 if the data ends before this month does. July 2024 is partial: the data ends on 6 July and the month contains refunds only."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: recognised_gross_gmv_gbp
        description: "Money in (payments and resolved chargebacks) recognised this month, in GBP, before refunds."
        data_tests:
          - not_null

      - name: recognised_net_gmv_gbp
        description: "Total GMV recognised this month, in GBP: money in less refunds. Fraud, pending chargebacks and duplicate refunds are excluded. Chargebacks count in the month they resolve."
        data_tests:
          - not_null

      - name: recognised_revenue_gbp
        description: "Platform revenue recognised this month, in GBP. The headline revenue measure. Chargebacks count in the month they resolve, so a closed month never changes."
        data_tests:
          - not_null

      - name: recognised_transaction_count
        description: "Number of transactions recognised this month."
        data_tests:
          - not_null

      - name: originated_net_gmv_gbp
        description: "Net GMV in GBP for the transactions that happened this month, counting chargebacks resolved as of the latest data. Past months are restated as chargebacks resolve."
        data_tests:
          - not_null

      - name: originated_revenue_gbp
        description: "Revenue in GBP for the transactions that happened this month, on the same basis as `originated_net_gmv_gbp`."
        data_tests:
          - not_null

      - name: pending_chargebacks_gbp
        config:
          meta:
            additivity: semi_additive
        description: "Chargebacks that had happened but were not yet resolved at month end, in GBP: the revenue still outstanding at that point."
        data_tests:
          - not_null

      - name: contract_status
        description: "Contract status at month end: `no contract`, `not started`, `active` or `ended`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['no contract', 'not started', 'active', 'ended']

      - name: spend_threshold
        config:
          meta:
            additivity: non_additive
        description: "{{ doc('spend_threshold') }} Null for clients without a contract."

      - name: monthly_contract_spend_gbp
        description: "Contract spend added this month, in GBP: the sum of `contract_spend_gbp` for transactions that take effect this month. Null for clients without a contract."
        data_tests:
          - not_null:
              config:
                where: "contract_status != 'no contract'"

      - name: cumulative_contract_spend_gbp
        config:
          meta:
            additivity: semi_additive
        description: "Contract spend to date at month end, in GBP. Compared against `spend_threshold`. Null for clients without a contract."
        data_tests:
          - not_null:
              config:
                where: "contract_status != 'no contract'"

      - name: pct_of_spend_threshold
        config:
          meta:
            additivity: non_additive
        description: "`cumulative_contract_spend_gbp` as a fraction of `spend_threshold` (1 = threshold reached). Null for clients without a contract."
        data_tests:
          - not_null:
              config:
                where: "contract_status != 'no contract'"

      - name: discount_earned_date
        description: "Date the client's contract spend first reached its threshold, from which the discounted margin applies, as at month end: null until the month in which it is reached. No client reaches it in the data provided."

      - name: is_discount_active
        description: "1 if the discounted margin applies at month end: the threshold has been reached and the contract is still active. Null for clients without a contract."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
          - not_null:
              config:
                where: "contract_status != 'no contract'"

      - name: naive_cumulative_gross_spend_gbp
        config:
          meta:
            additivity: semi_additive
        description: "For comparison only, not a recommended definition: every transaction in the contract window at its gross amount, whatever its type (fraud and refunds included as positive), to date at month end. This naive measure reaches the threshold for C001 and C002, where the qualifying measure never does. Null for clients without a contract."

      - name: is_naive_threshold_reached
        description: "For comparison only: 1 if `naive_cumulative_gross_spend_gbp` has reached `spend_threshold`. Null for clients without a contract."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
