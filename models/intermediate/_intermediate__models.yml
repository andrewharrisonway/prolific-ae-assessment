version: 2

models:
  - name: int__client_contracts
    description: "One row per client contract, with its end date. Defines the contract window once for every model that needs it."
    columns:
      - name: client_id
        description: "{{ doc('client_id') }} Primary key of this model."
        tests:
          - unique
          - not_null

      - name: contract_start_date
        description: "{{ doc('contract_start_date') }} Passed through from staging, where it is tested."

      - name: contract_duration_months
        description: "{{ doc('contract_duration_months') }} Passed through from staging, where it is tested."

      - name: spend_threshold
        description: "{{ doc('spend_threshold') }} Passed through from staging, where it is tested."

      - name: discounted_fee_margin
        description: "{{ doc('discounted_fee_margin') }} Passed through from staging, where it is tested."

      - name: contract_end_date
        description: "Date the contract ends (exclusive): `contract_start_date` plus `contract_duration_months` months."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> contract_start_date"

  - name: int__transactions
    description: "One row per transaction, converted to GBP, with contract discounts applied and revenue calculated. Transaction type behaviour comes from the `transaction_types` seed."
    tests:
      - dbt_utils.equal_rowcount: # one row per staged transaction: catches joins that fan out or drop rows
          arguments:
            compare_model: ref('stg_global_transactions__transactions')
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }} Primary key of this model."
        tests:
          - unique
          - not_null

      - name: transaction_date
        description: "{{ doc('transaction_date') }} Passed through from staging, where it is tested."

      - name: client_id
        description: "{{ doc('client_id') }} Passed through from staging, where it is tested."

      - name: transaction_type
        description: "{{ doc('transaction_type') }} Passed through from staging, where it is tested."

      - name: transaction_currency
        description: "{{ doc('transaction_currency') }} Passed through from staging, where it is tested."

      - name: amount_direction
        description: "{{ doc('amount_direction') }} From the `transaction_types` seed, where it is tested; the relationships test in staging guarantees every transaction type has a match."

      - name: gross_amount_local
        description: "{{ doc('gross_amount_local') }} Staging's `transaction_amount`, renamed; tested in staging."

      - name: net_amount_local
        description: "{{ doc('net_amount_local') }}"
        tests:
          - not_null

      - name: gross_amount_gbp
        description: "{{ doc('gross_amount_gbp') }}"
        tests:
          - not_null

      - name: net_amount_gbp
        description: "{{ doc('net_amount_gbp') }}"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "< 0"
              config:
                where: "transaction_type = 'refund'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "transaction_type != 'refund'"

      - name: is_duplicate_refund
        description: "{{ doc('is_duplicate_refund') }} Passed through from staging, where it is set and tested."

      - name: is_revenue_recognised
        description: "{{ doc('is_revenue_recognised') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: is_spend_qualifying
        description: "{{ doc('is_spend_qualifying') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: applicable_fee_margin
        description: "{{ doc('applicable_fee_margin') }}"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

      - name: resolution_status
        description: "{{ doc('resolution_status') }} Null for transactions that need no resolution. Passed through from staging, where it is tested."

      - name: resolution_date
        description: "{{ doc('resolution_date') }} Also null for transactions that need no resolution. Passed through from staging, where it is tested."

      - name: recognition_date
        description: "{{ doc('recognition_date') }}"
        tests:
          - not_null:
              config:
                where: "is_revenue_recognised = 1"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "is_revenue_recognised = 0"

      - name: spend_effective_date
        description: "{{ doc('spend_effective_date') }}"
        tests:
          - not_null

      - name: is_in_contract_period
        description: "{{ doc('is_in_contract_period') }}"
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: contract_spend_gbp
        description: "{{ doc('contract_spend_gbp') }}"
        tests:
          - not_null:
              config:
                where: "is_in_contract_period IS NOT NULL"

      - name: is_discount_earned
        description: "{{ doc('is_discount_earned') }}"
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: revenue_gbp
        description: "{{ doc('revenue_gbp') }}"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= 0"
              config:
                where: "transaction_type = 'refund'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "transaction_type != 'refund'"
