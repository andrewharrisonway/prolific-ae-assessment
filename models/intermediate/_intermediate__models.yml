version: 2

models:
  - name: int_client_contracts_windowed
    description: >-
      One row per client contract, with its end date. Defines the contract
      window once for every model that needs it.
    columns:
      - name: client_id
        description: "{{ doc('client_id') }} Primary key of this model."
        data_tests:
          - unique
          - not_null

      - name: contract_start_date
        description: "{{ doc('contract_start_date') }}"

      - name: contract_duration_months
        description: "{{ doc('contract_duration_months') }}"

      - name: spend_threshold
        description: "{{ doc('spend_threshold') }}"

      - name: discounted_fee_margin
        description: "{{ doc('discounted_fee_margin') }}"

      - name: contract_end_date
        description: >-
          Date the contract ends (exclusive): `contract_start_date` plus
          `contract_duration_months` months.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> contract_start_date"


  - name: int_transactions_classified
    description: >-
      One row per transaction, with its type's behaviour from the
      `transaction_types` seed applied: the signed amount, resolution status,
      and whether it counts toward revenue and contract spend.
    data_tests:
      - dbt_utils.equal_rowcount: # one row per transaction: catches joins that fan out or drop rows
          arguments:
            compare_model: ref('stg_global_transactions__transactions')
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }} Primary key of this model."
        data_tests:
          - unique
          - not_null

      - name: transaction_date
        description: "{{ doc('transaction_date') }}"

      - name: client_id
        description: "{{ doc('client_id') }}"

      - name: transaction_type
        description: "{{ doc('transaction_type') }}"

      - name: transaction_currency
        description: "{{ doc('transaction_currency') }}"

      - name: platform_fee_margin
        description: "{{ doc('platform_fee_margin') }}"

      - name: amount_direction
        description: >-
          {{ doc('amount_direction') }} From the `transaction_types` seed.

      - name: gross_amount_local
        description: >-
          {{ doc('gross_amount_local') }} Staging's `transaction_amount`,
          renamed.

      - name: net_amount_local
        description: "{{ doc('net_amount_local') }}"
        data_tests:
          - not_null

      - name: resolution_status
        description: >-
          {{ doc('resolution_status') }} Null for transactions that need no
          resolution.

      - name: resolution_date
        description: >-
          {{ doc('resolution_date') }} Also null for transactions that need no
          resolution.

      - name: linked_transaction_id
        description: "{{ doc('linked_transaction_id') }}"

      - name: linked_payment_date
        description: "{{ doc('linked_payment_date') }}"
        data_tests:
          - not_null:
              config:
                where: "transaction_type = 'refund'"

      - name: is_duplicate_refund
        description: "{{ doc('is_duplicate_refund') }}"

      - name: spend_effective_date
        description: "{{ doc('spend_effective_date') }}"
        data_tests:
          - not_null

      - name: is_revenue_recognised
        description: "{{ doc('is_revenue_recognised') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: is_spend_qualifying
        description: "{{ doc('is_spend_qualifying') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false


  - name: int_transactions_converted_to_gbp
    description: >-
      One row per transaction, with its amounts converted to GBP at the latest
      exchange rate on or before the transaction date.
    data_tests:
      - dbt_utils.equal_rowcount: # one row per transaction: catches joins that fan out or drop rows
          arguments:
            compare_model: ref('int_transactions_classified')
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }} Primary key of this model."
        data_tests:
          - unique
          - not_null

      - name: transaction_date
        description: "{{ doc('transaction_date') }}"

      - name: client_id
        description: "{{ doc('client_id') }}"

      - name: transaction_type
        description: "{{ doc('transaction_type') }}"

      - name: transaction_currency
        description: "{{ doc('transaction_currency') }}"

      - name: platform_fee_margin
        description: "{{ doc('platform_fee_margin') }}"

      - name: amount_direction
        description: "{{ doc('amount_direction') }}"

      - name: gross_amount_local
        description: "{{ doc('gross_amount_local') }}"

      - name: net_amount_local
        description: "{{ doc('net_amount_local') }}"

      - name: resolution_status
        description: "{{ doc('resolution_status') }}"

      - name: resolution_date
        description: "{{ doc('resolution_date') }}"

      - name: linked_transaction_id
        description: "{{ doc('linked_transaction_id') }}"

      - name: linked_payment_date
        description: "{{ doc('linked_payment_date') }}"

      - name: is_duplicate_refund
        description: "{{ doc('is_duplicate_refund') }}"

      - name: spend_effective_date
        description: "{{ doc('spend_effective_date') }}"

      - name: is_revenue_recognised
        description: "{{ doc('is_revenue_recognised') }}"

      - name: is_spend_qualifying
        description: "{{ doc('is_spend_qualifying') }}"

      - name: gross_amount_gbp
        description: "{{ doc('gross_amount_gbp') }}"
        data_tests:
          - not_null

      - name: net_amount_gbp
        description: "{{ doc('net_amount_gbp') }}"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "< 0"
              config:
                where: "amount_direction = -1"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "amount_direction = 1"


  - name: int_transactions_with_contract_spend
    description: >-
      One row per transaction, with its client's contract window applied: its
      contribution to contract spend, the client's running contract spend, and
      whether the discount has been earned.
    data_tests:
      - dbt_utils.equal_rowcount: # one row per transaction: catches joins that fan out or drop rows
          arguments:
            compare_model: ref('int_transactions_converted_to_gbp')
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }} Primary key of this model."
        data_tests:
          - unique
          - not_null

      - name: transaction_date
        description: "{{ doc('transaction_date') }}"

      - name: client_id
        description: "{{ doc('client_id') }}"

      - name: transaction_type
        description: "{{ doc('transaction_type') }}"

      - name: transaction_currency
        description: "{{ doc('transaction_currency') }}"

      - name: platform_fee_margin
        description: "{{ doc('platform_fee_margin') }}"

      - name: amount_direction
        description: "{{ doc('amount_direction') }}"

      - name: gross_amount_local
        description: "{{ doc('gross_amount_local') }}"

      - name: net_amount_local
        description: "{{ doc('net_amount_local') }}"

      - name: gross_amount_gbp
        description: "{{ doc('gross_amount_gbp') }}"

      - name: net_amount_gbp
        description: "{{ doc('net_amount_gbp') }}"

      - name: resolution_status
        description: "{{ doc('resolution_status') }}"

      - name: resolution_date
        description: "{{ doc('resolution_date') }}"

      - name: linked_transaction_id
        description: "{{ doc('linked_transaction_id') }}"

      - name: is_duplicate_refund
        description: "{{ doc('is_duplicate_refund') }}"

      - name: spend_effective_date
        description: "{{ doc('spend_effective_date') }}"

      - name: is_revenue_recognised
        description: "{{ doc('is_revenue_recognised') }}"

      - name: is_spend_qualifying
        description: "{{ doc('is_spend_qualifying') }}"

      - name: discounted_fee_margin
        description: >-
          {{ doc('discounted_fee_margin') }} From
          `int_client_contracts_windowed`; null for clients without a contract.
        data_tests:
          - not_null:
              config:
                where: "is_in_contract_period IS NOT NULL"

      - name: is_in_contract_period
        description: "{{ doc('is_in_contract_period') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: contract_spend_gbp
        description: "{{ doc('contract_spend_gbp') }}"
        data_tests:
          - not_null:
              config:
                where: "is_in_contract_period IS NOT NULL"

      - name: running_contract_spend_gbp
        description: >-
          The client's contract spend to date, including this transaction, in
          GBP, in the order transactions take effect (`spend_effective_date`,
          then `transaction_id`). Null for clients without a contract.
        data_tests:
          - not_null:
              config:
                where: "is_in_contract_period IS NOT NULL"

      - name: is_discount_earned
        description: "{{ doc('is_discount_earned') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false


  - name: int_transactions_with_revenue
    description: >-
      One row per transaction, with the applicable fee margin, the date revenue
      is recognised, and revenue in GBP. The last intermediate step, read by
      `fct_transactions`.
    data_tests:
      - dbt_utils.equal_rowcount: # refunds look up their payment's margin: catches a join that fans out or drops rows
          arguments:
            compare_model: ref('int_transactions_with_contract_spend')
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }} Primary key of this model."
        data_tests:
          - unique
          - not_null

      - name: transaction_date
        description: "{{ doc('transaction_date') }}"

      - name: client_id
        description: "{{ doc('client_id') }}"

      - name: transaction_type
        description: "{{ doc('transaction_type') }}"

      - name: transaction_currency
        description: "{{ doc('transaction_currency') }}"

      - name: amount_direction
        description: "{{ doc('amount_direction') }}"

      - name: gross_amount_local
        description: "{{ doc('gross_amount_local') }}"

      - name: net_amount_local
        description: "{{ doc('net_amount_local') }}"

      - name: gross_amount_gbp
        description: "{{ doc('gross_amount_gbp') }}"

      - name: net_amount_gbp
        description: "{{ doc('net_amount_gbp') }}"

      - name: is_duplicate_refund
        description: "{{ doc('is_duplicate_refund') }}"

      - name: is_revenue_recognised
        description: "{{ doc('is_revenue_recognised') }}"

      - name: is_spend_qualifying
        description: "{{ doc('is_spend_qualifying') }}"

      - name: applicable_fee_margin
        description: "{{ doc('applicable_fee_margin') }}"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

      - name: resolution_status
        description: >-
          {{ doc('resolution_status') }} Null for transactions that need no
          resolution.

      - name: resolution_date
        description: >-
          {{ doc('resolution_date') }} Null for transactions that need no
          resolution.

      - name: recognition_date
        description: "{{ doc('recognition_date') }}"
        data_tests:
          - not_null:
              config:
                where: "is_revenue_recognised = 1"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "is_revenue_recognised = 0"

      - name: spend_effective_date
        description: "{{ doc('spend_effective_date') }}"

      - name: is_in_contract_period
        description: "{{ doc('is_in_contract_period') }}"

      - name: contract_spend_gbp
        description: "{{ doc('contract_spend_gbp') }}"

      - name: is_discount_earned
        description: "{{ doc('is_discount_earned') }}"

      - name: revenue_gbp
        description: "{{ doc('revenue_gbp') }}"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= 0"
              config:
                where: "amount_direction = -1"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "amount_direction = 1"
