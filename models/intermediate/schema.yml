version: 2

models:
  - name: int__transactions
    description: "One row per transaction, converted to GBP, with contract discounts applied and revenue calculated. Transaction type behaviour comes from the `transaction_types` seed."
    tests:
      - dbt_utils.equal_rowcount: # one row per staged transaction: catches joins that fan out or drop rows
          arguments:
            compare_model: ref('stg_transactions__transactions')
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }} Primary key of this model."
        tests:
          - unique
          - not_null

      - name: transaction_date
        description: "{{ doc('transaction_date') }} Passed through from staging, where it is tested."

      - name: client_id
        description: "{{ doc('client_id') }} Passed through from staging, where it is tested."

      - name: transaction_type
        description: "{{ doc('transaction_type') }} Passed through from staging, where it is tested."

      - name: transaction_currency
        description: "{{ doc('transaction_currency') }} Passed through from staging, where it is tested."

      - name: amount_direction
        description: "{{ doc('amount_direction') }} From the `transaction_types` seed, where it is tested; the relationships test in staging guarantees every transaction type has a match."

      - name: gross_amount_local
        description: "Amount as recorded, in the original currency (staging's `transaction_amount`, renamed). Always positive; tested in staging."

      - name: net_amount_local
        description: "Signed amount in the original currency (`gross_amount_local * amount_direction`)."
        tests:
          - not_null

      - name: gross_amount_gbp
        description: "Recorded amount converted to GBP at the latest rate on or before the transaction date."
        tests:
          - not_null

      - name: net_amount_gbp
        description: "Signed amount in GBP. Negative for refunds, positive otherwise."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "< 0"
              config:
                where: "transaction_type = 'refund'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                where: "transaction_type != 'refund'"

      - name: is_duplicate_refund
        description: "{{ doc('is_duplicate_refund') }} Passed through from staging, where it is set and tested."

      - name: is_revenue_recognised
        description: "1 if this transaction generates revenue: the type recognises revenue, nothing is outstanding (chargebacks must be resolved), and it is not a duplicate refund."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: is_spend_qualifying
        description: "1 if this transaction's type and status count toward cumulative contract spend; duplicate refunds never count. Contract rules are applied afterwards, when spend is accumulated: only transactions inside the contract window count, and a refund only counts if the payment it reverses was inside the window."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: applicable_fee_margin
        description: "Fee margin applied: the contracted discounted margin once the spend threshold is reached within the contract term, otherwise the platform fee margin."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

      - name: revenue_gbp
        description: "Platform revenue in GBP: `net_amount_gbp * applicable_fee_margin` when `is_revenue_recognised`, otherwise 0."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= 0"
              config:
                where: "transaction_type = 'refund'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                where: "transaction_type != 'refund'"
