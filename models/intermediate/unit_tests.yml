version: 2

# No client reaches its spend threshold in the provided data, so the discount
# logic is never exercised by the real data. These unit tests prove it with
# small hand-built fixtures.
#
# Fee margins (0.25 standard, 0.125 discounted) are chosen to be exact in
# floating point, so expected revenue compares exactly. Amounts are chosen so
# revenue is never a whole number: dbt casts expected values with SQLite's
# numeric affinity, which would turn an expected 150.0 into 150 and fail the
# comparison against the model's 150.0.

unit_tests:
  - name: discount_applies_from_threshold_crossing_until_contract_end
    description: "The discounted margin applies from the transaction that takes cumulative spend to the threshold, for the rest of the contract term, and stops when the contract ends."
    model: int__transactions
    given:
      - input: ref('stg_transactions__transactions')
        rows:
          - {transaction_id: T1, client_id: C001, transaction_type: payment, transaction_date: '2024-01-10', transaction_amount: 602, transaction_currency: GBP, platform_fee_margin: 0.25, is_duplicate_refund: 0}
          - {transaction_id: T2, client_id: C001, transaction_type: payment, transaction_date: '2024-01-20', transaction_amount: 500, transaction_currency: GBP, platform_fee_margin: 0.25, is_duplicate_refund: 0}
          - {transaction_id: T3, client_id: C001, transaction_type: payment, transaction_date: '2024-01-25', transaction_amount: 100, transaction_currency: GBP, platform_fee_margin: 0.25, is_duplicate_refund: 0}
          - {transaction_id: T4, client_id: C001, transaction_type: payment, transaction_date: '2024-02-05', transaction_amount: 102, transaction_currency: GBP, platform_fee_margin: 0.25, is_duplicate_refund: 0}
      - input: ref('int__client_contracts')
        rows:
          - {client_id: C001, contract_start_date: '2024-01-01', contract_end_date: '2024-02-01', spend_threshold: 1000, discounted_fee_margin: 0.125}
      - input: ref('stg_currencies__currency_rates')
        rows:
          - {currency: GBP, rate_date: '2024-01-01', exchange_rate_to_gbp: 1}
      - input: ref('stg_transactions__transaction_resolutions')
        rows: []
      - input: ref('transaction_types')
        rows:
          - {transaction_type: payment, amount_direction: 1, recognises_revenue: 1, counts_toward_spend: 1, requires_resolution: 0}
    expect:
      rows:
        # cumulative spend 602: below threshold
        - {transaction_id: T1, applicable_fee_margin: 0.25, revenue_gbp: 150.5}
        # cumulative spend 1,102: crosses the threshold, discount applies
        - {transaction_id: T2, applicable_fee_margin: 0.125, revenue_gbp: 62.5}
        # discount continues for the rest of the term
        - {transaction_id: T3, applicable_fee_margin: 0.125, revenue_gbp: 12.5}
        # contract ended on 2024-02-01: standard margin again
        - {transaction_id: T4, applicable_fee_margin: 0.25, revenue_gbp: 25.5}

  - name: refund_of_pre_contract_payment_does_not_reduce_spend
    description: "A refund inside the contract window of a payment made before the contract started does not reduce contract spend, because the payment never counted toward it."
    model: int__transactions
    given:
      - input: ref('stg_transactions__transactions')
        rows:
          - {transaction_id: T1, client_id: C004, transaction_type: payment, transaction_date: '2024-02-10', transaction_amount: 502, transaction_currency: GBP, platform_fee_margin: 0.25, is_duplicate_refund: 0}
          - {transaction_id: T2, client_id: C004, transaction_type: refund, transaction_date: '2024-03-01', transaction_amount: 502, transaction_currency: GBP, platform_fee_margin: 0.25, linked_transaction_id: T1, is_duplicate_refund: 0}
          - {transaction_id: T3, client_id: C004, transaction_type: payment, transaction_date: '2024-03-05', transaction_amount: 1002, transaction_currency: GBP, platform_fee_margin: 0.25, is_duplicate_refund: 0}
      - input: ref('int__client_contracts')
        rows:
          - {client_id: C004, contract_start_date: '2024-03-01', contract_end_date: '2024-12-01', spend_threshold: 1000, discounted_fee_margin: 0.125}
      - input: ref('stg_currencies__currency_rates')
        rows:
          - {currency: GBP, rate_date: '2024-01-01', exchange_rate_to_gbp: 1}
      - input: ref('stg_transactions__transaction_resolutions')
        rows: []
      - input: ref('transaction_types')
        rows:
          - {transaction_type: payment, amount_direction: 1, recognises_revenue: 1, counts_toward_spend: 1, requires_resolution: 0}
          - {transaction_type: refund, amount_direction: -1, recognises_revenue: 1, counts_toward_spend: 1, requires_resolution: 0}
    expect:
      rows:
        # before the contract: standard margin
        - {transaction_id: T1, applicable_fee_margin: 0.25, revenue_gbp: 125.5}
        # the refund still reverses revenue, but does not reduce contract spend
        - {transaction_id: T2, applicable_fee_margin: 0.25, revenue_gbp: -125.5}
        # cumulative spend 1,002 (not 500): reaches the threshold, discount applies
        - {transaction_id: T3, applicable_fee_margin: 0.125, revenue_gbp: 125.25}
